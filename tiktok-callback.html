<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok авторизация — MarketShorts</title>
<style>
:root{--bg:#0b0b0d;--fg:#eae7e2;--mut:#9a958d;--acc:#d7ff4f;--line:#222226}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:56px 22px 80px}
h1{font-size:clamp(24px,4.4vw,32px);margin:0 0 10px;letter-spacing:-.02em}
p{color:#d6d2cb}
.mut{color:var(--mut)}
code{background:#17171b;padding:3px 8px;border-radius:6px;font-size:14px;word-break:break-all}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:22px 0;background:#111114}
.ok{color:var(--acc);font-weight:600}
.err{color:#ff7b72;font-weight:600}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Авторизация TikTok</h1>
  <p class="mut">MarketShorts — личный инструмент публикации. Эта страница принимает ответ TikTok и возвращает код авторизации приложению.</p>

  <div class="card" id="card">
    <p id="status" class="mut">Обрабатываю ответ…</p>
    <p class="mut" id="detail"></p>
  </div>

  <footer>MarketShorts · <a href="index.html">на главную</a> · <a href="privacy.html">политика</a></footer>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var state = q.get("state") || "";
  var err = q.get("error");
  var errDesc = q.get("error_description") || "";
  var statusEl = document.getElementById("status");
  var detailEl = document.getElementById("detail");

  if (err) {
    statusEl.className = "err";
    statusEl.textContent = "TikTok вернул ошибку: " + err;
    detailEl.textContent = errDesc;
    return;
  }
  if (!code) {
    statusEl.className = "err";
    statusEl.textContent = "В ссылке нет кода авторизации.";
    detailEl.textContent = "Откройте страницу заново из приложения MarketShorts.";
    return;
  }

  statusEl.className = "ok";
  statusEl.textContent = "Код получен.";
  detailEl.innerHTML =
    "Передайте его приложению: <code>" + code.replace(/[<>&"]/g, "") + "</code>";

  // Best effort: if the desktop app is listening on the loopback port, hand
  // the code over automatically. Browsers may block this request, so the
  // manual path above always stays available.
  fetch("http://127.0.0.1:8787/callback?code=" + encodeURIComponent(code) +
        "&state=" + encodeURIComponent(state), { mode: "no-cors" })
    .then(function () {
      statusEl.textContent = "Код получен и передан приложению.";
    })
    .catch(function () {});
})();
</script>
</body>
</html>
